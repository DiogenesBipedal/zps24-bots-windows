# Builds the patched Metamod:Source and NavBot for the Windows ZPS 2.4 dedicated server
# (Source 2007 / "orangebox", 32-bit), with MSVC on a Windows runner. Same pinned versions and
# patches as the Linux build in the core repo (core/scripts/build.sh).
name: Build Windows binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with the core repo)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Short build root: object file names include the path, and the link command for NavBot's
      # hundreds of files hits Windows' command line limit from the default workspace.
      - name: Build root
        shell: bash
        run: mkdir -p /c/w && echo "W=/c/w" >> $GITHUB_ENV

      - name: AMBuild (pinned)
        shell: bash
        run: |
          cd /c/w
          git clone -q https://github.com/alliedmodders/ambuild ambuild
          git -C ambuild checkout -q 01212cb
          python -m pip install -q ./ambuild

      - name: Fetch sources (pinned)
        shell: bash
        run: |
          cd /c/w
          clone() { # dir url ref
            git clone -q --recursive "$2" "$1"
            git -C "$1" checkout -q "$3"
            git -C "$1" submodule update -q --init --recursive
          }
          clone hl2sdk-orangebox https://github.com/alliedmodders/hl2sdk           88bc34ab
          clone metamod-source   https://github.com/alliedmodders/metamod-source   75dd7b2
          clone sourcemod        https://github.com/alliedmodders/sourcemod        03865e00c
          clone NavBot           https://github.com/caxanga334/NavBot              0.1.2-pr2

      - name: Apply ZPS 2.4 patches
        shell: bash
        run: |
          cd /c/w
          git -C metamod-source apply --whitespace=nowarn "$GITHUB_WORKSPACE/repo/core/patches/metamod-zps24.patch"
          git -C NavBot apply --whitespace=nowarn "$GITHUB_WORKSPACE/repo/core/patches/navbot-zps24.patch"

      - name: Build Metamod:Source (orangebox, x86)
        shell: bash
        run: |
          cd /c/w/metamod-source && mkdir build && cd build
          python ../configure.py --sdks=orangebox --hl2sdk-root="C:/w" --targets=x86 --enable-optimize
          ambuild

      - name: Build NavBot (orangebox, x86)
        shell: bash
        run: |
          cd /c/w/NavBot && mkdir build && cd build
          python ../configure.py --sdks=orangebox --hl2sdk-root="C:/w" \
            --sm-path="C:/w/sourcemod" --mms-path="C:/w/metamod-source" \
            --targets=x86 --enable-optimize
          ambuild

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p bin/addons/metamod bin/addons/sourcemod
          cp -r /c/w/metamod-source/build/package/addons/metamod/* bin/addons/metamod/
          cp -r /c/w/NavBot/build/package/addons/sourcemod/* bin/addons/sourcemod/
          find bin -name "*.pdb" -delete

      - name: SourceMod 1.12 (for spcomp and includes)
        shell: bash
        run: |
          f=$(curl -sf https://sm.alliedmods.net/smdrop/1.12/sourcemod-latest-windows)
          curl -sfLo sm.zip "https://sm.alliedmods.net/smdrop/1.12/$f"
          mkdir sm && cd sm && 7z x -y ../sm.zip > /dev/null

      - name: Package
        shell: bash
        run: |
          ver=${GITHUB_REF_NAME}
          [[ "$GITHUB_REF" == refs/tags/* ]] || ver=dev-$(git -C repo rev-parse --short HEAD)
          echo "VER=$ver" >> $GITHUB_ENV
          repo/scripts/package.sh "$PWD/bin" "$PWD/sm" "$PWD/zps24-bots-windows-$ver"
          7z a -tzip "zps24-bots-windows-$ver.zip" "zps24-bots-windows-$ver" > /dev/null
          ls -la *.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zps24-bots-windows-${{ env.VER }}
          path: zps24-bots-windows-${{ env.VER }}/

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ZPS 2.4 Bots for Windows ${{ github.ref_name }}
          files: zps24-bots-windows-${{ env.VER }}.zip
          body: |
            Unzip, double-click install.bat, then run C:\zps24-server\start-server.bat.
            See the README inside the zip.
